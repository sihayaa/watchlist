<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Watchlist</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>🎬 Our Watchlist</h1>

    <div class="toolbar">

        <div class="toolbar-row">

            <div class="field title-field">
                <label>Title</label>
                <input
                    type="text"
                    id="title"
                    placeholder="Movie, Anime or TV Series">
            </div>

            <div class="field">
                <label>Genre</label>
                <select id="genre">
                    <option>Action</option>
                    <option>Adventure</option>
                    <option>Animation</option>
                    <option>Comedy</option>
                    <option>Crime</option>
                    <option>Drama</option>
                    <option>Fantasy</option>
                    <option>Horror</option>
                    <option>Mystery</option>
                    <option>Romance</option>
                    <option>Sci-Fi</option>
                    <option>Thriller</option>
                </select>
            </div>

            <div class="field">
                <label>Type</label>
                <select id="type">
                    <option>Movie</option>
                    <option>Series</option>
                    <option>Anime</option>
                </select>
            </div>

            <div class="field progress-field">
                <label>Season</label>
                <input
                    type="number"
                    id="season"
                    min="1"
                    value="1">
            </div>

            <div class="field progress-field">
                <label>Episode</label>
                <input
                    type="number"
                    id="episode"
                    min="1"
                    value="1">
            </div>

            <button id="addBtn">
                + Add
            </button>

        </div>

        <div class="search-row">

            <input
                type="text"
                id="search"
                placeholder="🔍 Search titles...">

        </div>

    </div>

    <div id="watchlist" class="grid">


    </div>

</div>

<script src="script.js"></script>

</body>
</html>
